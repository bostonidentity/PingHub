# .github/workflows/aic-studio-ci.yml
name: aic-studio CI

on:
  pull_request:
    paths:
      - "aic-studio/**"
      - ".github/workflows/aic-studio-ci.yml"
  push:
    branches: [development, main]
    paths:
      - "aic-studio/**"
      - ".github/workflows/aic-studio-ci.yml"

defaults:
  run:
    working-directory: aic-studio

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aic-studio/package-lock.json
      - name: Install
        run: npm ci
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild --force -m node_modules/better-sqlite3
        continue-on-error: true
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Integration tests (xvfb on Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
