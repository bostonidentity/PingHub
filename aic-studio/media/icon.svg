<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!-- Outer ring suggesting a network / cloud node -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Inner solid dot — the identity record -->
  <circle cx="12" cy="12" r="2.5"/>
  <!-- Four cardinal spokes — federation/sync nodes -->
  <circle cx="12" cy="3" r="1.5"/>
  <circle cx="12" cy="21" r="1.5"/>
  <circle cx="3" cy="12" r="1.5"/>
  <circle cx="21" cy="12" r="1.5"/>
  <!-- Thin connector lines -->
  <line x1="12" y1="5" x2="12" y2="9" stroke="currentColor" stroke-width="1.2"/>
  <line x1="12" y1="15" x2="12" y2="19" stroke="currentColor" stroke-width="1.2"/>
  <line x1="5" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.2"/>
  <line x1="15" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.2"/>
</svg>
